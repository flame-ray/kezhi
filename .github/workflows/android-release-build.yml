name: Android release build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Test frontend
        run: bun run test
      - name: Build unsigned arm64 APK
        run: |
          chmod +x src-tauri/gen/android/gradlew
          bun run android:build --target aarch64
      - name: Test Android
        working-directory: src-tauri/gen/android
        run: ./gradlew :app:testUniversalReleaseUnitTest -x :app:rustBuildUniversalRelease --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: android-arm64-unsigned
          path: src-tauri/gen/android/app/build/outputs/apk/universal/release/*unsigned.apk
          if-no-files-found: error
          retention-days: 14
