<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>课织 · 交互预览</title>
  <link rel="stylesheet" href="./src/styles.css" />
  <style>
    .preview-notice{position:fixed;z-index:100;left:50%;bottom:12px;transform:translateX(-50%);padding:7px 12px;border-radius:99px;color:#fff;font-size:10px;background:rgba(38,41,51,.82);backdrop-filter:blur(8px);pointer-events:none}
    .course-card{cursor:pointer}
  </style>
</head>
<body>
  <div id="preview-root"></div>
  <script>
    const icons = {
      calendar:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M16 3v4M8 3v4M3 10h18M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"/>',
      today:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
      exam:'<path d="M5 3h14v18l-3-2-4 2-4-2-3 2z"/><path d="M9 8h6M9 12h6M9 16h3"/>',
      chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
      plugin:'<path d="M9 3v4a2 2 0 0 1-2 2H3M15 3v4a2 2 0 0 0 2 2h4M9 21v-4a2 2 0 0 0-2-2H3M15 21v-4a2 2 0 0 1 2-2h4"/><rect x="9" y="9" width="6" height="6" rx="1"/>',
      settings:'<circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 1 1-14 0 7 7 0 0 1 14 0M12 2v3M12 19v3M2 12h3M19 12h3"/>',
      left:'<path d="m15 18-6-6 6-6"/>', right:'<path d="m9 18 6-6-6-6"/>',
      refresh:'<path d="M20 11a8 8 0 1 0 1.4 4.5"/><path d="M20 4v7h-7"/>',
      plus:'<path d="M12 5v14M5 12h14"/>', download:'<path d="M12 3v12M7 10l5 5 5-5M5 21h14"/>',
      clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
      location:'<path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0z"/><circle cx="12" cy="10" r="2.5"/>',
      person:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
      close:'<path d="m6 6 12 12M18 6 6 18"/>', edit:'<path d="M12 20h9M16.5 3.5a2.12 2.12 0 0 1 3 3L8 18l-4 1 1-4z"/>',
      shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/><path d="m9 12 2 2 4-4"/>',
      upload:'<path d="M12 16V4M7 9l5-5 5 5M5 20h14"/>', school:'<path d="m3 10 9-6 9 6-9 6zM7 13v5M17 13v5M4 20h16"/>',
      search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>', check:'<path d="m5 12 4 4L19 6"/>', warning:'<path d="M10.3 3.8 2.4 18a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.8a2 2 0 0 0-3.4 0zM12 9v4M12 17h.01"/>',
      trash:'<path d="M4 7h16M9 7V4h6v3M7 7l1 14h8l1-14M10 11v6M14 11v6"/>', arrow:'<path d="M5 12h14m-5-5 5 5-5 5"/>'
    };
    const icon = name => `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${icons[name]}</svg>`;
    const periods=[['08:20','09:05'],['09:10','09:55'],['10:15','11:00'],['11:05','11:50'],['14:30','15:15'],['15:20','16:05'],['16:25','17:10'],['17:15','18:00'],['19:00','19:45'],['19:50','20:35'],['20:40','21:25']];
    const demoCourses=[
      ['english-a','大学英语（一）','陈老师','博学楼 B301',2,1,2,'teal',''],['math-a','高等数学（一）','林老师','讲堂群 206',3,1,2,'blue',''],['english-b','大学英语（一）','陈老师','讲堂群 305',4,1,2,'teal',''],['inorganic-a','无机化学','赵老师','创新楼 C401',5,1,2,'coral',''],
      ['safety','国家安全教育','黄老师','讲堂群 302',2,3,4,'violet','单周'],['inorganic-b','无机化学','赵老师','讲堂群 206',3,3,4,'coral',''],['career','职业发展与就业指导','吴老师','讲堂群 304',4,3,4,'rose','双周'],['math-b','高等数学（一）','林老师','创新楼 C401',5,3,4,'blue',''],
      ['mental','大学生心理健康教育','郑老师','讲堂群 303',1,5,6,'rose','单周'],['ai','人工智能基础','郑老师','讲堂群 303',1,7,8,'rose',''],['lab','无机化学实验','赵老师','化学实验室 505',4,5,8,'indigo',''],['history','中国近现代史纲要','许老师','讲堂群 304',5,5,6,'amber',''],
      ['safety-b','安全教育','黄老师','讲堂群 202',1,9,10,'indigo',''],['inorganic-c','无机化学','赵老师','讲堂群 205',2,9,10,'coral',''],['chinese','大学语文','周老师','讲堂群 302',3,9,10,'blue',''],['math-c','高等数学（一）','林老师','讲堂群 206',4,9,10,'blue','']
    ];
    const courses=[];
    let week=1;
    const root=document.querySelector('#preview-root');
    root.innerHTML=`<div class="app-shell">
      <aside class="sidebar">
        <div class="brand"><span class="brand-mark"><i></i><i></i><i></i></span><span class="brand-copy"><strong>课织</strong><small>KEZHI</small></span></div>
        <nav class="nav-list">${[['课表','calendar'],['今天','today'],['考试','exam'],['成绩','chart']].map((x,i)=>`<button class="nav-item ${i===0?'active':''}">${icon(x[1])}<span>${x[0]}</span></button>`).join('')}</nav>
        <div class="sidebar-spacer"></div><nav class="nav-list secondary"><button class="nav-item">${icon('plugin')}<span>插件</span></button><button class="nav-item">${icon('settings')}<span>设置</span></button></nav>
        <button class="account-card"><span class="avatar">学</span><span class="account-copy"><strong>学生账号</strong><small id="account-school">尚未连接学校</small></span></button>
      </aside>
      <main class="main-area">
        <header class="topbar"><div><div class="breadcrumb"><span id="term-name">尚未选择学期</span><i></i><span id="crumb-week">等待导入</span></div><div class="title-row"><h1>我的课表</h1><span class="term-status waiting" id="term-status">待导入</span></div></div>
        <div class="top-actions"><button class="soft-button">${icon('download')}导出</button><button class="soft-button" id="import">${icon('upload')}导入</button><button class="soft-button" id="sync">${icon('refresh')}同步</button><button class="primary-button" id="new-course">${icon('plus')}新建课程</button></div></header>
        <section class="calendar-toolbar"><div class="week-control"><button class="icon-button" id="prev">${icon('left')}</button><button class="today-button" id="current">本周</button><button class="icon-button" id="next">${icon('right')}</button><div class="week-date"><strong id="week-name">第 1 周</strong><span id="week-range">2026年8月31日–9月6日</span></div></div>
        <div class="view-options"><button class="preset-button" id="preset">${icon('clock')}<span>夏季作息</span>${icon('right')}</button><div class="segmented"><button class="active">周</button><button>日</button></div></div></section>
        <div class="workspace"><section class="calendar-panel"><div class="calendar-scroll"><div class="calendar-grid week-enter-right" id="grid" style="--period-count:11"></div></div><div class="empty-schedule-overlay" id="empty-onboarding"><div class="empty-weave"><i></i><i></i><i></i><span>${icon('calendar')}</span></div><span class="empty-eyebrow">从这里开始</span><h2>导入你的第一张课表</h2><p>登录学校官方教务系统，课织会读取课程并在导入前让你检查结果。密码不会输入到课织自己的表单中。</p><div class="empty-actions"><button class="primary-button" id="empty-import">${icon('school')}导入教务课表</button><button class="soft-button" id="empty-manual">${icon('plus')}手动添加课程</button></div><div class="empty-import-types"><span>${icon('shield')}学校官方登录</span><span>Excel</span><span>ICS</span><span>本地保存</span></div></div><div class="calendar-hint"><span class="hint-dot"></span>拖动课程可临时调整时间；本地修改不会被自动同步静默覆盖。</div></section>
        <aside class="detail-panel detail-empty" id="detail"><div class="next-label">接下来</div><div class="empty-orbit"><span class="orbit-dot"></span>${icon('calendar')}</div><h3>点选一门课程</h3><p>查看教师、教室、周次以及提醒设置。课程卡片也可以直接拖动。</p><div class="privacy-note">${icon('shield')}<span>姓名与学号默认隐藏，仅保存在本机。</span></div></aside></div>
      </main></div><div class="preview-notice">零依赖交互预览 · 正式界面由 React / Tauri 驱动</div>`;

    const grid=document.querySelector('#grid');
    const dayNames=['周一','周二','周三','周四','周五','周六','周日'];
    function renderGrid(){
      document.querySelector('#empty-onboarding').hidden=courses.length>0;
      grid.innerHTML=`<div class="calendar-corner"><span>节次</span><small>夏季作息</small></div>`;
      const monday=new Date(2026,7,31+(week-1)*7);
      dayNames.forEach((name,i)=>{const d=new Date(monday);d.setDate(monday.getDate()+i);grid.insertAdjacentHTML('beforeend',`<div class="day-heading ${week===1&&i===0?'today':''}" style="grid-column:${i+2};grid-row:1"><span>${name}</span><strong>${d.getDate()}</strong></div>`)});
      periods.forEach((p,i)=>grid.insertAdjacentHTML('beforeend',`<div class="period-label" style="grid-column:1;grid-row:${i+2}"><strong>${i+1}</strong><span>${p[0]}</span><small>${p[1]}</small></div>`));
      for(let day=1;day<=7;day++)for(let p=1;p<=11;p++)grid.insertAdjacentHTML('beforeend',`<div class="calendar-cell" style="grid-column:${day+1};grid-row:${p+1}"></div>`);
      courses.forEach(c=>grid.insertAdjacentHTML('beforeend',`<button class="course-card color-${c[7]}" data-id="${c[0]}" style="grid-column:${c[4]+1};grid-row:${c[5]+1}/span ${c[6]-c[5]+1}"><span class="course-title">${c[1]}</span><span class="course-meta">${icon('location')}${c[3]}</span><span class="course-teacher">${c[2]}</span>${c[8]?`<span class="course-badge">${c[8]}</span>`:''}</button>`));
      grid.querySelectorAll('.course-card').forEach(el=>el.onclick=()=>showCourse(el.dataset.id));
    }
    function showCourse(id){
      const c=courses.find(x=>x[0]===id);document.querySelectorAll('.course-card').forEach(x=>x.classList.toggle('selected',x.dataset.id===id));
      document.querySelector('#detail').className='detail-panel';document.querySelector('#detail').innerHTML=`<div class="detail-actions"><button class="icon-button" id="detail-edit">${icon('edit')}</button><button class="icon-button" id="detail-close">${icon('close')}</button></div><span class="detail-color color-${c[7]}"></span><div class="detail-code">COURSE · ${c[0].toUpperCase()}</div><h2>${c[1]}</h2><p class="detail-subtitle">1–18周${c[8]?' · '+c[8]:''}</p><div class="detail-list"><div>${icon('clock')}<span><strong>${dayNames[c[4]-1]} · 第${c[5]}–${c[6]}节</strong><small>${periods[c[5]-1][0]}–${periods[c[6]-1][1]}</small></span></div><div>${icon('location')}<span><strong>${c[3]}</strong><small>点击可复制教室</small></span></div><div>${icon('person')}<span><strong>${c[2]}</strong><small>任课教师</small></span></div></div><button class="reminder-row"><span>${icon('clock')}<span><strong>上课提醒</strong><small>提前 15 分钟</small></span></span><i class="switch active"></i></button>`;
      document.querySelector('#detail-close').onclick=()=>location.reload();document.querySelector('#detail-edit').onclick=()=>openCourseEditor(id);
    }
    function updateWeek(n){week=Math.min(24,Math.max(1,n));document.querySelector('#week-name').textContent=`第 ${week} 周`;document.querySelector('#crumb-week').textContent=`第 ${week} 周`;const m=new Date(2026,7,31+(week-1)*7),s=new Date(m);s.setDate(m.getDate()+6);document.querySelector('#week-range').textContent=`${m.getMonth()+1}月${m.getDate()}日–${s.getMonth()+1}月${s.getDate()}日`;renderGrid()}
    function markScheduleReady(school='本地课表'){document.querySelector('#account-school').textContent=school;document.querySelector('#term-name').textContent=school==='本地课表'?'自定义课表':'2026–2027 第一学期';document.querySelector('#crumb-week').textContent=`第 ${week} 周`;document.querySelector('#term-status').textContent=school==='本地课表'?'本地':'进行中';document.querySelector('#term-status').classList.remove('waiting')}
    document.querySelector('#prev').onclick=()=>updateWeek(week-1);document.querySelector('#next').onclick=()=>updateWeek(week+1);document.querySelector('#current').onclick=()=>updateWeek(1);
    document.querySelector('#sync').onclick=e=>{if(courses.length===0){openImportWizard();return}e.currentTarget.classList.add('syncing');setTimeout(()=>{e.currentTarget.classList.remove('syncing');openSyncReview()},700)};
    function openCourseEditor(id){
      const c=id?courses.find(x=>x[0]===id):['manual-'+Date.now(),'','','',1,1,2,'blue',''];
      document.body.insertAdjacentHTML('beforeend',`<div class="dialog-backdrop" id="course-backdrop"><section class="dialog course-editor-dialog"><header class="dialog-header"><div><span class="eyebrow">${id?'编辑课程':'新建课程'}</span><h2>${id?c[1]:'添加一门课程'}</h2></div><button class="icon-button" id="course-close">${icon('close')}</button></header><div class="editor-scroll"><div class="form-grid"><label class="field span-2"><span>课程名称 *</span><input id="course-title" value="${c[1]}" placeholder="例如：高等数学（一）"></label><label class="field"><span>教师</span><input id="course-teacher" value="${c[2]}" placeholder="任课教师"></label><label class="field"><span>上课地点</span><input id="course-location" value="${c[3]}" placeholder="教学楼与教室"></label><label class="field"><span>星期</span><select id="course-day">${dayNames.map((x,i)=>`<option value="${i+1}" ${c[4]===i+1?'selected':''}>${x}</option>`).join('')}</select></label><label class="field"><span>开始节次</span><select id="course-start">${periods.map((_,i)=>`<option value="${i+1}" ${c[5]===i+1?'selected':''}>第 ${i+1} 节</option>`).join('')}</select></label><label class="field"><span>结束节次</span><select id="course-end">${periods.map((_,i)=>`<option value="${i+1}" ${c[6]===i+1?'selected':''}>第 ${i+1} 节</option>`).join('')}</select></label><label class="field"><span>备注</span><input id="course-note" value="${c[8]}" placeholder="单周、实验要求等"></label></div><div class="form-section"><span class="field-label">上课周次</span><div class="rule-tabs" id="week-rules"><button class="active">连续</button><button>单周</button><button>双周</button><button>自定义</button></div><div class="week-range"><label class="field"><span>开始周</span><input type="number" value="1"></label><span>至</span><label class="field"><span>结束周</span><input type="number" value="18"></label></div></div><div class="form-section"><span class="field-label">课程颜色</span><div class="color-picker" id="color-picker">${['blue','teal','coral','violet','rose','amber','indigo'].map(x=>`<button class="color-choice color-${x} ${c[7]===x?'active':''}" data-color="${x}">${c[7]===x?icon('check'):''}</button>`).join('')}</div></div><div class="form-error" id="course-error" hidden>${icon('warning')}请填写课程名称</div></div><footer class="dialog-footer course-editor-footer"><div>${id?`<button class="danger-button" id="course-delete">${icon('trash')}删除课程</button>`:''}</div><div class="footer-actions"><button class="cancel-button" id="course-cancel">取消</button><button class="primary-button" id="course-save">保存课程</button></div></footer></section></div>`);
      const close=()=>document.querySelector('#course-backdrop')?.remove();document.querySelector('#course-close').onclick=close;document.querySelector('#course-cancel').onclick=close;
      document.querySelectorAll('#week-rules button').forEach(button=>button.onclick=()=>{document.querySelectorAll('#week-rules button').forEach(x=>x.classList.remove('active'));button.classList.add('active')});
      document.querySelectorAll('#color-picker button').forEach(button=>button.onclick=()=>{document.querySelectorAll('#color-picker button').forEach(x=>{x.classList.remove('active');x.innerHTML=''});button.classList.add('active');button.innerHTML=icon('check')});
      document.querySelector('#course-save').onclick=()=>{const title=document.querySelector('#course-title').value.trim();if(!title){document.querySelector('#course-error').hidden=false;return}const updated=[c[0],title,document.querySelector('#course-teacher').value||'未设置教师',document.querySelector('#course-location').value||'未设置教室',Number(document.querySelector('#course-day').value),Number(document.querySelector('#course-start').value),Number(document.querySelector('#course-end').value),document.querySelector('#color-picker .active').dataset.color,document.querySelector('#course-note').value];if(id){const index=courses.findIndex(x=>x[0]===id);courses[index]=updated}else{courses.push(updated);markScheduleReady()}close();renderGrid();showCourse(updated[0])};
      if(id)document.querySelector('#course-delete').onclick=()=>{const index=courses.findIndex(x=>x[0]===id);courses.splice(index,1);close();renderGrid()};
    }

    function openImportWizard(){
      document.body.insertAdjacentHTML('beforeend',`<div class="dialog-backdrop" id="import-backdrop"><section class="dialog import-dialog"><header class="dialog-header import-header"><div><span class="eyebrow">导入教务课表</span><h2>连接你的学校</h2></div><button class="icon-button" id="import-close">${icon('close')}</button></header><div class="wizard-steps"><div class="active"><i>1</i><span>选择学校</span></div><div><i>2</i><span>安全登录</span></div><div><i>3</i><span>读取课表</span></div><div><i>4</i><span>确认导入</span></div></div><div class="wizard-body"><label class="school-search">${icon('search')}<input placeholder="搜索学校或教务系统"></label><div class="school-list"><button class="school-row selected"><span class="school-icon">${icon('school')}</span><span><strong>宁德师范学院</strong><small>福建 · 宁德</small></span><em class="adapter-status beta">测试中</em>${icon('check')}</button><button class="school-row"><span class="school-icon">${icon('school')}</span><span><strong>正方教务系统（其他学校）</strong><small>通用适配器</small></span><em class="adapter-status beta">测试中</em></button><button class="school-row"><span class="school-icon">${icon('school')}</span><span><strong>青果教务系统</strong><small>社区适配器</small></span><em class="adapter-status planned">规划中</em></button><button class="school-row"><span class="school-icon">${icon('upload')}</span><span><strong>其他学校 / 通用导入</strong><small>Excel · ICS · 手动</small></span><em class="adapter-status ready">可用</em></button></div><div class="wizard-note">${icon('school')}<span>找不到学校时仍可通过 Excel、ICS 或手动方式导入。</span></div></div><footer class="dialog-footer wizard-footer"><button class="cancel-button" id="import-cancel">取消</button><button class="primary-button" id="import-continue">继续${icon('arrow')}</button></footer></section></div>`);
      const close=()=>document.querySelector('#import-backdrop')?.remove();document.querySelector('#import-close').onclick=close;document.querySelector('#import-cancel').onclick=close;
      document.querySelectorAll('.school-row').forEach(row=>row.onclick=()=>{document.querySelectorAll('.school-row').forEach(x=>x.classList.remove('selected'));row.classList.add('selected')});
      document.querySelector('#import-continue').onclick=()=>{document.querySelector('.wizard-body').innerHTML=`<div class="login-stage"><div class="browser-preview"><div class="browser-bar"><i></i><i></i><i></i><span>${icon('shield')}jwgl.ndnu.edu.cn</span></div><div class="browser-content"><span class="large-school-icon">${icon('school')}</span><h3>宁德师范学院</h3><p id="login-copy">登录将在独立的内置浏览器窗口中进行。</p><span class="connected-badge" id="connected" hidden>${icon('check')}已连接</span></div></div><div class="security-copy">${icon('shield')}<div><strong>密码只输入在学校官方页面</strong><span>课织不创建密码输入框，也不保存明文密码。</span></div></div></div>`;document.querySelector('#import-continue').textContent='打开内置浏览器';document.querySelector('#import-continue').onclick=()=>{document.querySelector('#import-continue').textContent='正在打开…';setTimeout(()=>{document.querySelector('#login-copy').textContent='登录状态已就绪，可以返回课织读取课程。';document.querySelector('#connected').hidden=false;document.querySelector('#import-continue').textContent='读取课表';document.querySelector('#import-continue').onclick=()=>{document.querySelector('.wizard-body').innerHTML=`<div class="import-review"><div class="review-summary"><span><strong>${demoCourses.length}</strong><small>课程记录</small></span><span><strong>8</strong><small>不同课程</small></span><span><strong>0</strong><small>严重错误</small></span></div><div class="review-success">${icon('check')}<div><strong>课表结构完整</strong><span>已识别教师、教室、单双周和连续节次。</span></div></div><div class="review-warning">${icon('warning')}<div><strong>1项需要留意</strong><span>第11节没有课程，仍会保留在作息方案中。</span></div></div></div>`;document.querySelector('#import-continue').textContent='确认导入';document.querySelector('#import-continue').onclick=()=>{if(courses.length===0)courses.push(...demoCourses.map(x=>[...x]));markScheduleReady('宁德师范学院');close();renderGrid()}}},850)}};
    }

    function openSyncReview(){
      document.body.insertAdjacentHTML('beforeend',`<div class="dialog-backdrop" id="sync-backdrop"><section class="dialog sync-dialog"><header class="dialog-header"><div><span class="eyebrow">同步发现变化</span><h2>选择要保留的版本</h2></div><button class="icon-button" id="sync-close">${icon('close')}</button></header><div class="sync-overview"><span class="sync-count">3</span><div><strong>教务系统与本地课表存在差异</strong><small>课织不会静默覆盖你的修改，请逐项确认。</small></div></div><div class="change-list">${[['高等数学（一）','教室变化','讲堂群 206','求知楼 208','blue'],['国家安全教育','教务停课','保留本地课程','本周停课','violet'],['大学体育（一）','新增课程','忽略新增课程','周三 第7–8节 · 风雨操场','teal']].map((x,i)=>`<article class="change-card"><header><span class="change-color color-${x[4]}"></span><div><strong>${x[0]}</strong><small>${x[1]}</small></div></header><div class="version-choices"><label><input type="radio" name="change-${i}"><span><em>本地版本</em><strong>${x[2]}</strong></span></label><label class="selected"><input type="radio" name="change-${i}" checked><span><em>教务版本</em><strong>${x[3]}</strong></span><i>推荐</i></label></div></article>`).join('')}</div><footer class="dialog-footer"><span>选择结果会写入本地同步历史</span><div class="footer-actions"><button class="cancel-button" id="sync-later">稍后处理</button><button class="primary-button" id="sync-apply">应用选择</button></div></footer></section></div>`);
      const close=()=>document.querySelector('#sync-backdrop')?.remove();document.querySelector('#sync-close').onclick=close;document.querySelector('#sync-later').onclick=close;document.querySelectorAll('.version-choices label').forEach(label=>label.onclick=()=>{label.parentElement.querySelectorAll('label').forEach(x=>x.classList.remove('selected'));label.classList.add('selected')});document.querySelector('#sync-apply').onclick=()=>{const math=courses.find(x=>x[0]==='math-a');if(math)math[3]='求知楼 208';const safety=courses.findIndex(x=>x[0]==='safety');if(safety>=0)courses.splice(safety,1);if(!courses.some(x=>x[0]==='new-pe'))courses.push(['new-pe','大学体育（一）','体育教研组','风雨操场',3,7,8,'teal','']);close();renderGrid()};
    }
    document.querySelector('#new-course').onclick=()=>openCourseEditor();document.querySelector('#import').onclick=openImportWizard;document.querySelector('#empty-import').onclick=openImportWizard;document.querySelector('#empty-manual').onclick=()=>openCourseEditor();
    function openPresetDialog(){
      document.body.insertAdjacentHTML('beforeend',`<div class="dialog-backdrop" id="preset-backdrop"><section class="dialog" role="dialog"><header class="dialog-header"><div><span class="eyebrow">作息方案</span><h2>让时间适应你的学校</h2></div><button class="icon-button" id="preset-close">${icon('close')}</button></header><div class="preset-tabs"><button class="active">夏季作息</button><button>冬季作息</button><button class="add-preset">${icon('plus')}新方案</button></div><div class="preset-title-row"><input value="夏季作息" aria-label="方案名称"><span>11 节课</span></div><div class="period-editor">${periods.map((p,i)=>`<div class="period-editor-row"><strong>${i+1}</strong><label>开始<input type="time" value="${p[0]}"></label><span>—</span><label>结束<input type="time" value="${p[1]}"></label></div>`).join('')}</div><footer class="dialog-footer"><span>修改会自动保存在本机</span><button class="primary-button" id="preset-done">完成</button></footer></section></div>`);
      const close=()=>document.querySelector('#preset-backdrop')?.remove();
      document.querySelector('#preset-close').onclick=close;document.querySelector('#preset-done').onclick=close;document.querySelector('#preset-backdrop').onclick=e=>{if(e.target.id==='preset-backdrop')close()};
    }
    document.querySelector('#preset').onclick=openPresetDialog;
    renderGrid();
  </script>
</body>
</html>
